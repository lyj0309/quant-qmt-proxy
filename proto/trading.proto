syntax = "proto3";

package qmt.trading;

import "common.proto";

message SessionInfo {
  string session_id = 1;
  string account_id = 2;
  qmt.common.SecurityAccountType account_type = 3;
  bool is_real = 4;
  string mode = 5;
  int64 opened_at_ms = 6;
  string environment = 7;
  string account_kind = 8;
  bool orders_enabled = 9;
  string account_profile = 10;
}

message OpenSessionRequest {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
}

message OpenSessionResponse {
  SessionInfo session = 1;
  qmt.common.Status status = 2;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool success = 1;
  qmt.common.Status status = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  SessionInfo session = 1;
  qmt.common.Status status = 2;
}

message GetStockAssetRequest {
  string session_id = 1;
}

message StockAsset {
  string account_id = 1;
  double cash = 2;
  double frozen_cash = 3;
  double market_value = 4;
  double total_asset = 5;
  double fetch_balance = 6;
}

message GetStockAssetResponse {
  StockAsset asset = 1;
  qmt.common.Status status = 2;
}

message GetStockPositionsRequest {
  string session_id = 1;
}

message StockPosition {
  string account_id = 1;
  string stock_code = 2;
  string instrument_name = 3;
  int64 volume = 4;
  int64 can_use_volume = 5;
  int64 frozen_volume = 6;
  int64 on_road_volume = 7;
  int64 yesterday_volume = 8;
  double open_price = 9;
  double avg_price = 10;
  double last_price = 11;
  double market_value = 12;
  double profit_rate = 13;
  string direction = 14;
  string secu_account = 15;
}

message GetStockPositionsResponse {
  repeated StockPosition positions = 1;
  qmt.common.Status status = 2;
}

message GetStockOrdersRequest {
  string session_id = 1;
  bool cancelable_only = 2;
}

message StockOrder {
  string account_id = 1;
  string stock_code = 2;
  string instrument_name = 3;
  string order_id = 4;
  string order_sysid = 5;
  int64 order_time_ms = 6;
  qmt.common.OrderSide order_type = 7;
  int64 order_volume = 8;
  qmt.common.StockPriceType price_type = 9;
  double price = 10;
  int64 traded_volume = 11;
  double traded_price = 12;
  int32 order_status_code = 13;
  string status_msg = 14;
  string strategy_name = 15;
  string order_remark = 16;
  string direction = 17;
  string offset_flag = 18;
  string secu_account = 19;
}

message GetStockOrdersResponse {
  repeated StockOrder orders = 1;
  qmt.common.Status status = 2;
}

message GetStockTradesRequest {
  string session_id = 1;
}

message StockTrade {
  string account_id = 1;
  string stock_code = 2;
  string instrument_name = 3;
  qmt.common.OrderSide order_type = 4;
  string traded_id = 5;
  int64 traded_time_ms = 6;
  double traded_price = 7;
  int64 traded_volume = 8;
  double traded_amount = 9;
  string order_id = 10;
  string order_sysid = 11;
  string strategy_name = 12;
  string order_remark = 13;
  string direction = 14;
  string offset_flag = 15;
  double commission = 16;
  string secu_account = 17;
}

message GetStockTradesResponse {
  repeated StockTrade trades = 1;
  qmt.common.Status status = 2;
}

message GetCreditDetailRequest {
  string session_id = 1;
}

message CreditDetail {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 status_code = 3;
  int64 update_time = 4;
  int32 calc_config = 5;
  double frozen_cash = 6;
  double balance = 7;
  double available = 8;
  double position_profit = 9;
  double market_value = 10;
  double fetch_balance = 11;
  double stock_value = 12;
  double fund_value = 13;
  double total_debt = 14;
  double enable_bail_balance = 15;
  double maintenance_collateral_ratio = 16;
  double assure_asset = 17;
  double financing_debt = 18;
  double financing_principal = 19;
  double financing_fee = 20;
  double securities_lending_debt = 21;
  double securities_lending_market_value = 22;
  double securities_lending_fee = 23;
  double other_fee = 24;
  double financing_max_quota = 25;
  double financing_available_quota = 26;
  double financing_used_quota = 27;
  double securities_lending_max_quota = 28;
  double securities_lending_available_quota = 29;
  double securities_lending_used_quota = 30;
  double short_sale_cash = 31;
  double used_short_sale_cash = 32;
  double remaining_short_sale_cash = 33;
}

message GetCreditDetailResponse {
  repeated CreditDetail details = 1;
  qmt.common.Status status = 2;
}

message CreditInstrumentFilterRequest {
  string session_id = 1;
  repeated string instrument_ids = 2;
}

message CreditCompact {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 compact_type = 3;
  int32 cashgroup_prop = 4;
  int32 exchange_id = 5;
  int32 open_date = 6;
  int64 business_volume = 7;
  int64 outstanding_volume = 8;
  int32 due_date = 9;
  double business_balance = 10;
  double business_fee = 11;
  double outstanding_balance = 12;
  double outstanding_fee = 13;
  double repaid_fee = 14;
  double repaid_balance = 15;
  string instrument_id = 16;
  string compact_id = 17;
  string position_str = 18;
}

message GetCreditCompactsResponse {
  repeated CreditCompact compacts = 1;
  qmt.common.Status status = 2;
}

message CreditSubject {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 short_sell_status = 3;
  int32 financing_status = 4;
  int32 exchange_id = 5;
  double short_sell_margin_ratio = 6;
  double financing_margin_ratio = 7;
  string instrument_id = 8;
}

message GetCreditSubjectsResponse {
  repeated CreditSubject subjects = 1;
  qmt.common.Status status = 2;
}

message CreditSloCode {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 cashgroup_prop = 3;
  int32 exchange_id = 4;
  int64 available_quantity = 5;
  string instrument_id = 6;
}

message GetCreditSloCodesResponse {
  repeated CreditSloCode instruments = 1;
  qmt.common.Status status = 2;
}

message CreditAssure {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 assure_status = 3;
  int32 exchange_id = 4;
  double assure_ratio = 5;
  string instrument_id = 6;
}

message GetCreditAssuresResponse {
  repeated CreditAssure instruments = 1;
  qmt.common.Status status = 2;
}

message GetNewPurchaseLimitsRequest {
  string session_id = 1;
}

message NewPurchaseLimit {
  string market = 1;
  int64 quantity = 2;
}

message GetNewPurchaseLimitsResponse {
  repeated NewPurchaseLimit limits = 1;
  qmt.common.Status status = 2;
}

message GetIpoDataRequest {
  string session_id = 1;
}

message IpoInstrument {
  string stock_code = 1;
  string name = 2;
  string instrument_type = 3;
  int64 min_purchase_quantity = 4;
  int64 max_purchase_quantity = 5;
  string purchase_date = 6;
  double issue_price = 7;
}

message GetIpoDataResponse {
  repeated IpoInstrument instruments = 1;
  qmt.common.Status status = 2;
}

message SubmitStockOrderRequest {
  string session_id = 1;
  string stock_code = 2;
  qmt.common.OrderSide side = 3;
  qmt.common.StockPriceType price_type = 4;
  int64 volume = 5;
  double price = 6;
  string strategy_name = 7;
  string order_remark = 8;
}

message SubmitStockOrderResponse {
  StockOrder order = 1;
  qmt.common.Status status = 2;
}

message CancelBySysIdTarget {
  string market = 1;
  string order_sysid = 2;
}

message CancelStockOrderRequest {
  string session_id = 1;
  oneof target {
    string order_id = 2;
    CancelBySysIdTarget sysid_target = 3;
  }
}

message CancelStockOrderResponse {
  bool success = 1;
  qmt.common.Status status = 2;
  bool confirmed = 3;
  bool has_latest_order = 4;
  StockOrder latest_order = 5;
  bool still_cancelable = 6;
  string message = 7;
}

message StreamTradingEventsRequest {
  string session_id = 1;
}

message AccountStatusEvent {
  string account_id = 1;
  qmt.common.SecurityAccountType account_type = 2;
  int32 status_code = 3;
}

message OrderErrorEvent {
  string account_id = 1;
  string order_id = 2;
  int32 error_id = 3;
  string error_msg = 4;
  string strategy_name = 5;
  string order_remark = 6;
}

message CancelErrorEvent {
  string account_id = 1;
  string order_id = 2;
  string order_sysid = 3;
  int32 error_id = 4;
  string error_msg = 5;
}

message TradingEvent {
  int64 event_time_ms = 1;
  oneof payload {
    AccountStatusEvent account_status = 2;
    StockAsset asset_update = 3;
    StockOrder order_update = 4;
    StockTrade trade_update = 5;
    StockPosition position_update = 6;
    OrderErrorEvent order_error = 7;
    CancelErrorEvent cancel_error = 8;
  }
}

service TradingService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc GetStockAsset(GetStockAssetRequest) returns (GetStockAssetResponse);
  rpc GetStockPositions(GetStockPositionsRequest) returns (GetStockPositionsResponse);
  rpc GetStockOrders(GetStockOrdersRequest) returns (GetStockOrdersResponse);
  rpc GetStockTrades(GetStockTradesRequest) returns (GetStockTradesResponse);
  rpc GetCreditDetail(GetCreditDetailRequest) returns (GetCreditDetailResponse);
  rpc GetCreditCompacts(CreditInstrumentFilterRequest) returns (GetCreditCompactsResponse);
  rpc GetCreditSubjects(CreditInstrumentFilterRequest) returns (GetCreditSubjectsResponse);
  rpc GetCreditSloCodes(CreditInstrumentFilterRequest) returns (GetCreditSloCodesResponse);
  rpc GetCreditAssures(CreditInstrumentFilterRequest) returns (GetCreditAssuresResponse);
  rpc GetNewPurchaseLimits(GetNewPurchaseLimitsRequest) returns (GetNewPurchaseLimitsResponse);
  rpc GetIpoData(GetIpoDataRequest) returns (GetIpoDataResponse);
  rpc SubmitStockOrder(SubmitStockOrderRequest) returns (SubmitStockOrderResponse);
  rpc CancelStockOrder(CancelStockOrderRequest) returns (CancelStockOrderResponse);
  rpc StreamTradingEvents(StreamTradingEventsRequest) returns (stream TradingEvent);
}
